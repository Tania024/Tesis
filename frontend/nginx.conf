server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Proxy API al backend (debe ir antes del location /pumapungo)
    location /pumapungo/api/ {
        rewrite ^/pumapungo/api/(.*) /api/$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA bajo /pumapungo y /pumapungo/
    location /pumapungo {
        alias /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache archivos estaticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Redirect raiz a /pumapungo
    location = / {
        return 301 /pumapungo;
    }
}
